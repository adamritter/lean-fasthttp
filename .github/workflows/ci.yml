name: Lean and wire tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - run: scripts/build.sh
      - run: python3 scripts/verify_artifacts.py
      - run: python3 scripts/verify_proofs.py
      - run: lake build pending_checks
      - run: .lake/build/bin/pending_checks
      - run: python3 scripts/verify_fast_protocol.py
      - run: python3 scripts/verify_rfc.py
      - run: python3 scripts/verify_generated.py
      - run: FASTHTTP_BACKEND=uv python3 scripts/verify_fast_protocol.py
      - run: FASTHTTP_BACKEND=uv python3 scripts/verify_rfc.py
      - run: python3 scripts/verify_uv.py
      - run: lake build uv_wakeup_test uv_machine_test
        working-directory: vendor/lean_uv
      - run: python3 scripts/test_wakeup.py && python3 scripts/test_machine.py
        working-directory: vendor/lean_uv
      - run: python3 scripts/sanitize.py
        working-directory: vendor/lean_uv
