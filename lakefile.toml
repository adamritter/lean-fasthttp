name = "fast_http"
version = "0.1.0"
defaultTargets = ["FastHTTP", "fast_http", "fast_http_example", "h1_http", "baseline_http", "v1_http", "protocol_probe", "uv_http", "uv_http_example"]

[[lean_lib]]
name = "FastHTTP"
globs = ["FastHTTP", "FastHTTP.+"]

[[lean_lib]]
name = "Bench"
globs = ["Bench.+"]

[[lean_exe]]
name = "fast_http"
root = "Bench.Main"

[[lean_exe]]
name = "fast_http_example"
root = "Tests.Server"

[[lean_exe]]
name = "h1_http"
root = "Bench.H1Main"

[[lean_exe]]
name = "baseline_http"
root = "Bench.BaselineMain"

[[lean_exe]]
name = "v1_http"
root = "Bench.V1Main"

[[lean_exe]]
name = "protocol_probe"
root = "Tests.ProtocolProbe"

[[require]]
name = "lean_uv"
git = "https://github.com/adamritter/lean-uv.git"
rev = "1d116e2a8c368ca932efbf6a16a6c8ef1e548596"

[[lean_exe]]
name = "uv_http"
root = "Bench.UVMain"

[[lean_exe]]
name = "uv_http_example"
root = "Tests.UVServer"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]
